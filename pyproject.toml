[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skynet-countdown-scoring-methodology"
version = "1.0"
description = "Reproduce the Skynet Countdown evaluation methodology on supplied AI news stories"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.24.0",
    "pydantic>=2.13.5",
]

[project.urls]
Homepage = "https://skynetcountdown.org"
Repository = "https://github.com/datawranglerai/skynet-countdown-scoring-methodology"
Issues = "https://github.com/datawranglerai/skynet-countdown-scoring-methodology/issues"

[project.scripts]
skynet-countdown = "skynet_countdown.__main__:main"

[tool.setuptools.packages.find]
include = ["skynet_countdown*"]

[tool.setuptools.package-data]
skynet_countdown = ["prompts/*.txt"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_unused_ignores = true
