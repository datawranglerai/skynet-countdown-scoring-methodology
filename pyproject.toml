[project]
name = "skynet-countdown-scoring-methodology"
version = "0.1.0"
description = "Reproduce the Skynet Countdown evaluation methodology on supplied AI news stories"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langsmith>=0.14.7",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "openai>=3.24.0",
    "pydantic>=2.13.5",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_unused_ignores = true
